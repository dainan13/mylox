name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: ruff check
        run: ruff check

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run the unit tests (no database required)
        run: pytest test -q --ignore=test/test_integration.py

  package:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build
        run: python -m build
      - name: Check the metadata
        run: python -m twine check --strict dist/*
      - name: The wheel must import and expose the public API
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata as md

          import mylox
          from mylox import CDCEngine, CDCHandler, EngineConfig, GtidSet, TableFilter

          assert mylox.__version__ == md.version("mylox"), mylox.__version__
          print("mylox", mylox.__version__, "imports from", mylox.__file__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ci-distributions
          path: dist/
          if-no-files-found: error
